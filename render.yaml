# Render blueprint: FINN API on the free plan. Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: finn-api
    runtime: docker
    plan: free
    region: singapore
    # Docker paths resolve from the repo root (not rootDir), so spell them out
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FINN_CORS_ORIGINS
        value: "*"
