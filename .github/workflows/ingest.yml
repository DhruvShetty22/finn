# Keeps production fresh: filings every 30 min in market hours (fetch → classify → cards), prices after the close.
# Dormant until the DATABASE_URL secret exists. Timing is best-effort (GitHub may delay scheduled runs).
name: ingest
on:
  schedule:
    - cron: "*/30 3-11 * * 1-5"   # 09:00–17:00 IST, weekdays: filings
    - cron: "15 11 * * 1-5"       # 16:45 IST, weekdays: EOD prices + filings
    - cron: "0 5 * * 0,6"         # weekend midday: filings (boards do meet on Saturdays)
  workflow_dispatch:
concurrency: { group: ingest, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FINN_HTTP_CACHE: "0"
    steps:
      - name: configured?
        id: cfg
        working-directory: .  # runs before checkout, when backend/ doesn't exist yet
        run: if [ -n "$DATABASE_URL" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "DATABASE_URL secret not set; skipping"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok
      - uses: astral-sh/setup-uv@v6
        if: steps.cfg.outputs.ok
      - run: uv sync --frozen --no-dev
        if: steps.cfg.outputs.ok
      - name: EOD prices
        if: steps.cfg.outputs.ok && (github.event.schedule == '15 11 * * 1-5' || github.event_name == 'workflow_dispatch')
        run: uv run python -m finn.jobs eod
      - name: filings → classify → cards
        if: steps.cfg.outputs.ok
        run: uv run python -m finn.jobs filings --days 2
